---
# site.yml
# Primary entry point for the observability infrastructure

- name: Basic OS Hardening & Common Setup
  hosts: monitoring
  become: yes
  roles:
    - common

- name: Docker Engine Orchestration
  hosts: monitoring
  become: yes
  roles:
    - docker

- name: Deploy Observability Stack (Grafana/Prometheus/Loki)
  hosts: monitoring
  become: yes
  roles:
    - observability

- name: Configure Automated Backups
  hosts: monitoring
  become: yes
  roles:
    - backup