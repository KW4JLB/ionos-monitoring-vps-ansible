---
# site.yml
# Primary entry point for the observability infrastructure

- name: Basic OS Hardening & Common Setup
  hosts: monitoring
  become: yes
  roles:
    - common

- name: Docker Engine Orchestration
  hosts: monitoring
  become: yes
  roles:
    - docker

- name: Deploy Observability Stack (Grafana/Prometheus/Loki)
  hosts: monitoring
  become: yes
  roles:
    - observability

- name: Install Asterisk Dashboards
  hosts: monitoring
  become: yes
  tags: asterisk
  roles:
    - grafana-asterisk

- name: Install Proxmox VE Dashboards
  hosts: monitoring
  become: yes
  tags: proxmox
  roles:
    - grafana-proxmox

- name: Configure Automated Backups
  hosts: monitoring
  become: yes
  roles:
    - backup