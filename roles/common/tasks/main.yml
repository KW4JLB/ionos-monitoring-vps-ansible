---
- name: Verify minimum requirements
  assert:
    that:
      - ansible_memtotal_mb >= 1024
      - ansible_python_version is version('3.8', '>=')
    fail_msg: "Server does not meet minimum requirements (1GB RAM, Python 3.8+)"
    success_msg: "Server meets minimum requirements"

- name: Check available disk space
  assert:
    that:
      - item.size_available > 5368709120  # 5GB in bytes
    fail_msg: "Insufficient disk space on {{ item.mount }}"
  loop: "{{ ansible_mounts }}"
  when: item.mount == '/'

- name: Update apt cache and upgrade packages
  apt:
    update_cache: yes
    upgrade: dist
    cache_valid_time: 3600

- name: Install baseline administrative tools
  apt:
    name:
      - curl
      - htop
      - ufw
      - fail2ban
      - unattended-upgrades
    state: present

- name: Configure unattended-upgrades for security patches
  copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades

- name: Configure Fail2Ban (SSH Hardening)
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
  notify: restart fail2ban

- name: "UFW - Allow SSH (Critical: Don't lock yourself out)"
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: UFW - Allow Grafana Web UI
  community.general.ufw:
    rule: allow
    port: '3000'
    proto: tcp

- name: UFW - Allow Prometheus (remote metrics ingestion)
  community.general.ufw:
    rule: allow
    port: '9090'
    proto: tcp

- name: UFW - Allow Loki (remote log ingestion)
  community.general.ufw:
    rule: allow
    port: '3100'
    proto: tcp

- name: UFW - Set default deny and enable
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny