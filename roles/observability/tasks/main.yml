- name: Create monitoring base directory
  file:
    path: /opt/monitoring
    state: directory
    mode: '0755'

- name: Create Prometheus data directory
  file:
    path: /opt/monitoring/prometheus
    state: directory
    owner: 65534  # Prometheus runs as nobody (UID 65534)
    group: 65534
    mode: '0755'

- name: Create Loki data directory
  file:
    path: /opt/monitoring/loki
    state: directory
    owner: 10001  # Loki default UID
    group: 10001
    mode: '0755'

- name: Create Grafana data directory
  file:
    path: /opt/monitoring/grafana
    state: directory
    owner: 472  # Grafana default UID
    group: 472
    mode: '0755'

- name: Create Grafana provisioning directories
  file:
    path: "{{ item }}"
    state: directory
    owner: 472
    group: 472
    mode: '0755'
  loop:
    - /opt/monitoring/grafana/provisioning
    - /opt/monitoring/grafana/provisioning/datasources

- name: Deploy Grafana datasource provisioning
  template:
    src: grafana/datasources.yml.j2
    dest: /opt/monitoring/grafana/provisioning/datasources/datasources.yml
    owner: 472
    group: 472
    mode: '0644'

- name: Deploy Prometheus configuration
  template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus.yml
    owner: 65534
    group: 65534
    mode: '0644'

- name: Deploy Loki configuration
  template:
    src: loki-config.yml.j2
    dest: /opt/monitoring/loki-config.yml
    owner: 10001
    group: 10001
    mode: '0644'

- name: Deploy Docker Compose file from template
  template:
    src: docker-compose.yml.j2
    dest: /opt/monitoring/docker-compose.yml
    mode: '0644'

- name: Start Monitoring Stack
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring
    state: present
    pull: always
    recreate: always
  register: docker_compose_result

- name: Wait for services to be healthy
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ item }}"
    delay: 5
    timeout: 60
  loop:
    - 443   # HTTPS nginx-proxy (Grafana access)
    - 9090  # Prometheus
    - 3100  # Loki

- name: Wait for Grafana API to be ready
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/health"
    method: GET
    status_code: 200
    timeout: 30
    validate_certs: false
  retries: 10
  delay: 5

# --- Organization Management ---

- name: Create additional Grafana organizations
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/orgs"
    method: POST
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ item.name }}"
    status_code: [200, 409]  # 409 = org already exists
    validate_certs: false
  loop: "{{ grafana_orgs | default([]) | selectattr('id', 'ne', 1) | list }}"
  when: grafana_orgs is defined

- name: Reload Grafana datasource provisioning after org creation
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/admin/provisioning/datasources/reload"
    method: POST
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
    status_code: [200, 204]
    validate_certs: false
  ignore_errors: yes
  when: grafana_orgs is defined and (grafana_orgs | length > 1)

# --- User Management ---

- name: Create Grafana users via API
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/admin/users"
    method: POST
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ item.name }}"
      email: "{{ item.email }}"
      login: "{{ item.login }}"
      password: "{{ item.password }}"
    status_code: [200, 412]  # 412 = user already exists
    validate_certs: false
  loop: "{{ grafana_users | default([]) }}"
  when: grafana_users is defined

- name: Look up Grafana user IDs
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/users/lookup?loginOrEmail={{ item.login }}"
    method: GET
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
    status_code: [200, 404]
    validate_certs: false
  loop: "{{ grafana_users | default([]) }}"
  when: grafana_users is defined
  register: all_user_lookup

- name: Build user login-to-ID map
  set_fact:
    grafana_user_id_map: "{{ grafana_user_id_map | default({}) | combine({item.item.login: item.json.id}) }}"
  loop: "{{ all_user_lookup.results | default([]) }}"
  when:
    - all_user_lookup.results is defined
    - item.json is defined
    - item.json.id is defined

- name: Grant Grafana server admin permissions
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/admin/users/{{ grafana_user_id_map[item.login] }}/permissions"
    method: PUT
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      isGrafanaAdmin: true
    status_code: [200, 404]
    validate_certs: false
  loop: "{{ grafana_users | default([]) }}"
  when:
    - grafana_users is defined
    - grafana_user_id_map is defined
    - item.is_admin | default(false)
    - item.login in grafana_user_id_map

# --- Per-Org Membership Management ---

- name: Add users to their organization memberships
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/orgs/{{ item.1.org_id }}/users"
    method: POST
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      loginOrEmail: "{{ item.0.login }}"
      role: "{{ item.1.role }}"
    status_code: [200, 409]  # 409 = user already in org
    validate_certs: false
  with_subelements:
    - "{{ grafana_users | default([]) }}"
    - org_memberships
    - skip_missing: true
  when: grafana_users is defined

- name: Update user role in Main Org for members with explicit org 1 membership
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/orgs/1/users/{{ grafana_user_id_map[item.login] }}"
    method: PATCH
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      role: "{{ (item.org_memberships | selectattr('org_id', 'equalto', 1) | first).role }}"
    status_code: [200, 404]
    validate_certs: false
  loop: "{{ grafana_users | default([]) }}"
  when:
    - grafana_users is defined
    - grafana_user_id_map is defined
    - item.login in grafana_user_id_map
    - 1 in (item.org_memberships | default([]) | map(attribute='org_id') | list)

- name: Remove users from Main Org when not in their org memberships
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/orgs/1/users/{{ grafana_user_id_map[item.login] }}"
    method: DELETE
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
    status_code: [200, 404]
    validate_certs: false
  loop: "{{ grafana_users | default([]) }}"
  when:
    - grafana_users is defined
    - grafana_user_id_map is defined
    - item.login in grafana_user_id_map
    - item.org_memberships is defined
    - 1 not in (item.org_memberships | map(attribute='org_id') | list)

- name: Display deployment status
  debug:
    msg: "Observability stack deployed successfully. Access Grafana at https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}."
