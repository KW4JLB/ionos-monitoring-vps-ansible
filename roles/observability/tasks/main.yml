- name: Create monitoring base directory
  file:
    path: /opt/monitoring
    state: directory
    mode: '0755'

- name: Create Prometheus data directory
  file:
    path: /opt/monitoring/prometheus
    state: directory
    owner: 65534  # Prometheus runs as nobody (UID 65534)
    group: 65534
    mode: '0755'

- name: Create Loki data directory
  file:
    path: /opt/monitoring/loki
    state: directory
    owner: 10001  # Loki default UID
    group: 10001
    mode: '0755'

- name: Create Grafana data directory
  file:
    path: /opt/monitoring/grafana
    state: directory
    owner: 472  # Grafana default UID
    group: 472
    mode: '0755'

- name: Create Grafana provisioning directories
  file:
    path: "{{ item }}"
    state: directory
    owner: 472
    group: 472
    mode: '0755'
  loop:
    - /opt/monitoring/grafana/provisioning
    - /opt/monitoring/grafana/provisioning/datasources

- name: Deploy Grafana datasource provisioning
  template:
    src: grafana/datasources.yml.j2
    dest: /opt/monitoring/grafana/provisioning/datasources/datasources.yml
    owner: 472
    group: 472
    mode: '0644'

- name: Deploy Prometheus configuration
  template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus.yml
    owner: 65534
    group: 65534
    mode: '0644'

- name: Deploy Loki configuration
  template:
    src: loki-config.yml.j2
    dest: /opt/monitoring/loki-config.yml
    owner: 10001
    group: 10001
    mode: '0644'

- name: Deploy Docker Compose file from template
  template:
    src: docker-compose.yml.j2
    dest: /opt/monitoring/docker-compose.yml
    mode: '0644'

- name: Start Monitoring Stack
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring
    state: present
    pull: always
    recreate: always
  register: docker_compose_result

- name: Wait for services to be healthy
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ item }}"
    delay: 5
    timeout: 60
  loop:
    - 443   # HTTPS nginx-proxy (Grafana access)
    - 9090  # Prometheus
    - 3100  # Loki

- name: Wait for Grafana API to be ready
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/health"
    method: GET
    status_code: 200
    timeout: 30
    validate_certs: false
  retries: 10
  delay: 5

- name: Create Grafana users via API
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/admin/users"
    method: POST
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ item.name }}"
      email: "{{ item.email }}"
      login: "{{ item.login }}"
      password: "{{ item.password }}"
    status_code: [200, 412]  # 412 = user already exists
    validate_certs: false
  loop: "{{ grafana_users | default([]) }}"
  when: grafana_users is defined
  register: created_users

- name: Get user ID for admin permission setting
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/users/lookup?loginOrEmail={{ item.login }}"
    method: GET
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
    status_code: [200, 404]
    validate_certs: false
  loop: "{{ grafana_users | default([]) }}"
  when: grafana_users is defined and (item.is_admin | default(false))
  register: user_lookup

- name: Set user as admin via API  
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/admin/users/{{ item.json.id }}/permissions"
    method: PUT
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      isGrafanaAdmin: true
    status_code: [200, 404]  # 404 if user doesn't exist
    validate_certs: false
  loop: "{{ user_lookup.results | default([]) }}"
  when: 
    - user_lookup.results is defined
    - item.json is defined
    - item.json.id is defined

- name: Set organization role to Admin for admin users
  uri:
    url: "https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}/api/orgs/1/users/{{ item.json.id }}"
    method: PATCH
    headers:
      Authorization: "Basic {{ ('admin:' + vault_grafana_admin_password) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      role: "Admin"
    status_code: [200, 404]  # 404 if user doesn't exist
    validate_certs: false
  loop: "{{ user_lookup.results | default([]) }}"
  when: 
    - user_lookup.results is defined
    - item.json is defined
    - item.json.id is defined

- name: Display deployment status
  debug:
    msg: "Observability stack deployed successfully. Access Grafana at https://{{ grafana_domain | default('monitoring.kw4jlb.com') }}. Additional users and teams will be configured via Grafana API."